<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unlock Download - EnrouteIn</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/components.css">
    <style>
        body { 
            padding-top: 72px; 
            background: var(--bg-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: var(--font-sans);
        }

        .page-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem 1.5rem;
        }

        .unlock-card {
            width: 100%;
            max-width: 520px;
            background: var(--bg-secondary);
            padding: 3rem 2.5rem;
            border-radius: var(--radius-2xl);
            box-shadow: var(--shadow-xl);
            border: 1px solid var(--color-border);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* Decorative top border */
        .unlock-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: var(--color-primary);
        }

        .icon-wrapper {
            width: 76px;
            height: 76px;
            background: var(--color-primary-light);
            border-radius: var(--radius-2xl);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem auto;
            color: var(--color-primary);
            border: 1px solid rgba(37, 99, 235, 0.2);
        }

        .icon-wrapper svg {
            width: 36px;
            height: 36px;
            stroke-width: 2.2;
        }

        .unlock-title {
            font-size: 2rem;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            letter-spacing: -0.03em;
            font-family: var(--font-heading);
        }

        .mod-subtitle {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-weight: 500;
        }

        .steps-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .step-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.25rem;
            border-radius: var(--radius-xl);
            background: var(--bg-primary);
            border: 1px solid var(--color-border);
            transition: all 0.3s ease;
        }

        .step-row.active {
            background: var(--bg-secondary);
            border-color: var(--color-primary);
            box-shadow: var(--shadow-md);
        }

        .step-row.disabled {
            opacity: 0.45;
            pointer-events: none;
            background: var(--bg-primary);
        }

        .step-left {
            display: flex;
            align-items: center;
            gap: 1rem;
            text-align: left;
        }

        .step-number {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-lg);
            background: var(--bg-secondary);
            color: var(--color-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1rem;
            border: 1px solid var(--color-border);
            font-family: var(--font-heading);
        }

        .step-row.completed .step-number {
            background: rgba(16, 185, 129, 0.1);
            color: #059669;
            border-color: rgba(16, 185, 129, 0.3);
        }

        .step-text h4 {
            margin: 0;
            color: var(--text-primary);
            font-size: 1.05rem;
            font-weight: 700;
            font-family: var(--font-heading);
        }

        .step-text p {
            margin: 0.2rem 0 0 0;
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 500;
        }

        .btn-action {
            padding: 0.65rem 1.35rem;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-family: inherit;
        }

        .btn-youtube {
            background: #ef4444;
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(239, 68, 68, 0.35);
        }

        .btn-youtube:hover {
            background: #dc2626;
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(239, 68, 68, 0.45);
        }

        .btn-completed {
            background: #10b981;
            color: #ffffff;
            pointer-events: none;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
        }

        .btn-download {
            background: var(--gradient-primary);
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
        }

        .btn-download:hover:not(:disabled) {
            background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.45);
        }

        .btn-download:disabled {
            background: #cbd5e1;
            box-shadow: none;
            cursor: not-allowed;
            color: #64748b;
        }

        .timer-status {
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: var(--color-primary);
            font-weight: 700;
            display: none;
            padding: 0.6rem 1rem;
            background: var(--color-primary-light);
            border-radius: var(--radius-full);
            border: 1px solid var(--color-primary-subtle);
            animation: pulse 1.5s infinite;
        }

        @media (max-width: 500px) {
            .step-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }
            .btn-action {
                width: 100%;
                justify-content: center;
            }
            .unlock-card {
                padding: 2rem 1.25rem;
            }
        }
    </style>
    <link rel="icon" type="image/png" href="assets/images/fevicon.png">
</head>
<body>

    <header class="header">
        <div class="container nav">
            <a href="index.html" class="logo">
                EnrouteIn<span>.</span>
                <span class="logo-badge">Store</span>
            </a>
            <div class="nav-actions">
                <a href="products.html" class="btn btn-outline btn-sm">Back to Store</a>
            </div>
        </div>
    </header>

    <div class="page-wrapper">
        <div class="unlock-card" id="unlock-ui">
            <div class="icon-wrapper">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
            </div>
            
            <h1 class="unlock-title">Unlock Download</h1>
            <p class="mod-subtitle" id="mod-name">Loading mod details...</p>

            <div class="steps-container">
                <!-- Step 1 -->
                <div class="step-row active" id="step-1">
                    <div class="step-left">
                        <div class="step-number" id="step-1-num">1</div>
                        <div class="step-text">
                            <h4>Subscribe & Support</h4>
                            <p>Verify channel to unlock file</p>
                        </div>
                    </div>
                    <button class="btn-action btn-youtube" id="btn-subscribe">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33 2.78 2.78 0 0 0 1.94 2c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.33 29 29 0 0 0-.46-5.33z"/><polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02" fill="#fff"/></svg>
                        <span>Subscribe</span>
                    </button>
                </div>

                <!-- Step 2 -->
                <div class="step-row disabled" id="step-2">
                    <div class="step-left">
                        <div class="step-number" id="step-2-num">2</div>
                        <div class="step-text">
                            <h4>Direct Download</h4>
                            <p>Instant file access</p>
                        </div>
                    </div>
                    <button class="btn-action btn-download" id="btn-get-link" disabled>
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                        <span>Download</span>
                    </button>
                </div>
            </div>
            
            <div class="timer-status" id="status-message">
                Please wait 10 seconds...
            </div>
        </div>
    </div>

    <!-- Logic -->
    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/sub2unlock.js"></script>
</body>
</html>
