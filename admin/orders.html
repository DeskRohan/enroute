<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders - Merchant Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="icon" type="image/png" href="../assets/images/fevicon.png">
    <style>
        /* ====================================================
           Desktop Table View Proportions
           ==================================================== */
        .desktop-orders-view {
            display: block;
            width: 100%;
            background: #FFFFFF;
            border-radius: var(--radius-lg);
            border: 1px solid var(--admin-border);
            box-shadow: var(--admin-shadow-sm);
            overflow: hidden;
            box-sizing: border-box;
        }

        .admin-table {
            width: 100% !important;
            table-layout: fixed;
            border-collapse: collapse;
            text-align: left;
        }

        .admin-table th,
        .admin-table td {
            padding: 0.85rem 0.75rem;
            font-size: 0.84rem;
            vertical-align: middle;
            border-bottom: 1px solid var(--admin-border-subtle);
        }

        .admin-table th {
            font-weight: 700;
            color: var(--admin-text-secondary);
            background: #F8F9FA;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid var(--admin-border);
            white-space: nowrap;
        }

        .admin-table tbody tr {
            transition: background 0.15s ease;
        }

        .admin-table tbody tr:hover {
            background: #FAFBFD;
        }

        .admin-table tbody tr:last-child td {
            border-bottom: none;
        }

        /* Strict desktop column proportions (sum to 100%) */
        .col-id { width: 11%; font-family: monospace; font-size: 0.8rem; }
        .col-customer { width: 16%; font-weight: 600; }
        .col-email { width: 21%; color: var(--admin-text-secondary); }
        .col-product { width: 22%; font-weight: 600; }
        .col-amount { width: 11%; font-weight: 700; }
        .col-status { width: 9%; }
        .col-date { width: 10%; }

        .order-cell-val {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .col-product .order-cell-val {
            white-space: normal;
            line-height: 1.35;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        /* Status Pills */
        .status-pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.68rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: var(--radius-xs);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            white-space: nowrap;
        }

        .status-completed {
            background: #E7F5EA;
            color: #238636;
            border: 1px solid rgba(35, 134, 54, 0.25);
        }

        .status-pending {
            background: #FFFBEB;
            color: #D97706;
            border: 1px solid rgba(217, 119, 6, 0.25);
        }

        .status-failed {
            background: #FDE8E8;
            color: #C62828;
            border: 1px solid rgba(198, 40, 40, 0.25);
        }

        /* ====================================================
           Native Mobile Orders Cards View (Hidden on Desktop)
           ==================================================== */
        .mobile-orders-view {
            display: none;
            flex-direction: column;
            gap: 0.75rem;
            width: 100%;
            box-sizing: border-box;
        }

        .mobile-order-card {
            background: #FFFFFF;
            border: 1px solid var(--admin-border);
            border-radius: var(--radius-lg);
            padding: 0.95rem 1rem;
            box-shadow: 0 1px 3px rgba(32, 33, 36, 0.05);
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            transition: transform 0.12s ease;
            box-sizing: border-box;
        }

        .mobile-order-card:active {
            transform: scale(0.995);
        }

        .moc-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 0.5rem;
            padding-bottom: 0.55rem;
            border-bottom: 1px solid var(--admin-border-subtle);
        }

        .moc-id-group {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .moc-order-id {
            font-family: monospace;
            font-weight: 800;
            font-size: 0.88rem;
            color: var(--admin-text-primary);
            letter-spacing: 0.02em;
        }

        .moc-date {
            font-size: 0.73rem;
            color: var(--admin-text-muted);
            font-weight: 500;
        }

        .moc-body {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .moc-product-name {
            font-size: 0.92rem;
            font-weight: 700;
            color: var(--admin-text-primary);
            line-height: 1.35;
        }

        .moc-customer-row {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.8rem;
            color: var(--admin-text-secondary);
            flex-wrap: wrap;
        }

        .moc-customer-icon {
            color: var(--admin-text-muted);
            flex-shrink: 0;
        }

        .moc-customer-name {
            font-weight: 600;
            color: var(--admin-text-primary);
        }

        .moc-dot {
            color: var(--admin-border-strong);
            font-size: 0.7rem;
        }

        .moc-customer-email {
            color: var(--admin-text-secondary);
            word-break: break-all;
        }

        .moc-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 0.6rem;
            border-top: 1px dashed var(--admin-border-subtle);
            margin-top: 0.1rem;
        }

        .moc-amount-label {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--admin-text-secondary);
        }

        .moc-amount-value {
            font-size: 1.05rem;
            font-weight: 800;
            color: var(--admin-text-primary);
            font-family: var(--font-heading);
        }

        /* Search & Filter Header Responsive Layout */
        .orders-page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1.15rem;
        }

        .orders-title-group {
            display: flex;
            align-items: center;
            gap: 0.55rem;
        }

        .orders-title-group h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--admin-text-primary);
        }

        .orders-count-pill {
            font-size: 0.72rem;
            font-weight: 700;
            padding: 2px 8px;
            background: #EAECEF;
            color: var(--admin-text-secondary);
            border-radius: var(--radius-full);
        }

        .orders-controls-bar {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 1.15rem;
        }

        .search-box-wrapper {
            position: relative;
            width: 100%;
            max-width: 360px;
        }

        .search-box-wrapper svg.search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--admin-text-muted);
            pointer-events: none;
        }

        .search-box-wrapper input {
            width: 100%;
            padding: 0.6rem 2.2rem 0.6rem 2.35rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--admin-border);
            font-size: 0.86rem;
            background: #FFFFFF;
            transition: all 0.15s ease;
            box-sizing: border-box;
        }

        .search-box-wrapper input:focus {
            outline: none;
            border-color: var(--admin-primary);
            box-shadow: 0 0 0 2px var(--admin-primary-light);
        }

        .search-clear-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: 1.15rem;
            line-height: 1;
            color: var(--admin-text-muted);
            cursor: pointer;
            padding: 4px;
            display: none;
        }

        .search-clear-btn:hover {
            color: var(--admin-text-primary);
        }

        .orders-stats-hint {
            font-size: 0.78rem;
            color: var(--admin-text-muted);
            font-weight: 500;
        }

        /* Empty State */
        .orders-empty-state {
            padding: 2.25rem 1.25rem;
            text-align: center;
            background: #FFFFFF;
            border: 1px dashed var(--admin-border);
            border-radius: var(--radius-lg);
            color: var(--admin-text-secondary);
            box-sizing: border-box;
            width: 100%;
        }

        .orders-empty-state svg {
            margin-bottom: 0.65rem;
            color: var(--admin-text-muted);
        }

        .orders-empty-state h3 {
            margin: 0 0 0.25rem 0;
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--admin-text-primary);
        }

        .orders-empty-state p {
            margin: 0;
            font-size: 0.82rem;
            color: var(--admin-text-muted);
        }

        /* ====================================================
           Breakpoints: On screens <= 768px, Switch to Cards
           ==================================================== */
        @media (max-width: 768px) {
            .desktop-orders-view {
                display: none !important;
            }

            .mobile-orders-view {
                display: flex !important;
            }

            .orders-page-header {
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
                margin-bottom: 0.9rem;
            }

            .orders-title-group h1 {
                font-size: 1.3rem;
            }

            .search-box-wrapper {
                max-width: 100% !important;
            }

            #export-csv-btn {
                padding: 0.42rem 0.75rem;
                font-size: 0.76rem;
                display: inline-flex;
                align-items: center;
                gap: 5px;
            }
        }
    </style>
</head>

        </div>

        <!-- Desktop Orders Table (screens > 768px) -->
        <div class="desktop-orders-view">

                    <tr>
                        <th class="col-id">Order ID</th>

                        <th class="col-email">Email</th>
                        <th class="col-product">Product</th>
                        <th class="col-amount">Amount</th>
                        <th class="col-status">Status</th>
                        <th class="col-date">Date</th>
                    </tr>
                </thead>
                <tbody id="orders-table-body">
