<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download - EnrouteIn</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/components.css">
    <style>
        body {
            padding-top: 80px;
        }

        .success-container {
            max-width: 680px;
            margin: var(--spacing-8) auto var(--spacing-16);
            padding: 0 var(--spacing-4);
            text-align: center;
        }

        .success-icon-badge {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(33, 136, 56, 0.1);
            color: var(--color-success);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: var(--spacing-5);
            border: 2px solid rgba(33, 136, 56, 0.3);
            box-shadow: var(--shadow-sm);
        }

        .success-icon-badge svg {
            width: 40px;
            height: 40px;
        }

        .success-title {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--color-dark-navy);
            font-family: var(--font-heading);
        }

        .order-details {
            background: var(--bg-surface);
            padding: var(--spacing-6);
            border-radius: var(--radius-lg);
            border: 1px solid var(--color-border);
            margin: var(--spacing-6) 0;
            text-align: left;
            box-shadow: var(--shadow-sm);
            position: relative;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-3);
            padding-bottom: var(--spacing-3);
            border-bottom: 1px solid var(--color-border-subtle);
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .detail-row span:last-child {
            color: var(--text-primary);
            font-weight: 600;
        }

        .detail-row:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .download-section {
            margin-top: var(--spacing-6);
        }

        /* Invoice Styles */
        .invoice-wrapper {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(24, 56, 47, 0.7);
            backdrop-filter: blur(4px);
            z-index: 9999;
            overflow-y: auto;
            padding: 2rem 1rem;
        }

        .invoice-wrapper.active {
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .invoice {
            background: #ffffff;
            color: var(--text-primary);
            max-width: 700px;
            width: 100%;
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-xl);
            border: 1px solid var(--color-border);
            font-family: var(--font-body);
        }

        .invoice-header {
            background: linear-gradient(135deg, #111215 0%, #202124 100%);
            color: #fff;
            padding: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 3px solid var(--color-primary);
        }

        .invoice-brand h2 {
            font-size: 1.6rem;
            font-weight: 800;
            margin: 0;
            font-family: var(--font-heading);
            color: #ffffff;
        }

        .invoice-brand h2 span {
            color: var(--color-primary);
        }

        .invoice-badge {
            background: rgba(50, 115, 84, 0.15);
            color: #327354;
            padding: 0.3rem 0.85rem;
            border-radius: var(--radius-sm);
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border: 1px solid rgba(50, 115, 84, 0.35);
        }

        .invoice-body {
            padding: 2rem;
        }

        .invoice-meta {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--color-border);
        }

        .invoice-meta-group h4 {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            margin: 0 0 0.35rem 0;
            font-weight: 700;
        }

        .invoice-meta-group p {
            font-size: 0.95rem;
            color: var(--text-primary);
            margin: 0;
            font-weight: 600;
        }

        .invoice-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1.5rem;
        }

        .invoice-table thead th {
            text-align: left;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            padding: 0.75rem 0;
            border-bottom: 2px solid var(--color-border);
            font-weight: 700;
        }

        .invoice-table thead th:last-child {
            text-align: right;
        }

        .invoice-table tbody td {
            padding: 1rem 0;
            border-bottom: 1px solid var(--color-border-subtle);
            font-size: 0.925rem;
        }

        .invoice-table tbody td:last-child {
            text-align: right;
            font-weight: 700;
            color: var(--color-primary);
        }

        .invoice-totals {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.5rem;
            padding-top: 1rem;
            border-top: 2px solid var(--color-border);
        }

        .invoice-total-row {
            display: flex;
            justify-content: space-between;
            width: 250px;
            font-size: 0.95rem;
        }

        .invoice-total-row.grand {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--color-primary);
            padding-top: 0.5rem;
            border-top: 1px solid var(--color-border);
            font-family: var(--font-heading);
        }

        .invoice-footer {
            background: var(--color-bg-subtle);
            padding: 1.25rem 2rem;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-secondary);
            border-top: 1px solid var(--color-border);
        }

        .invoice-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            padding: 1.25rem 2rem;
            background: var(--color-bg-subtle);
            border-top: 1px solid var(--color-border);
        }

        .invoice-actions button {
            padding: 0.65rem 1.25rem;
            border-radius: var(--radius-md);
            font-weight: 600;
            cursor: pointer;
            font-size: 0.85rem;
            border: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all var(--transition-fast);
        }

        .btn-print {
            background: var(--color-primary);
            color: #fff;
        }

        .btn-print:hover {
            background: var(--color-primary-dark);
        }

        .btn-close-invoice {
            background: var(--bg-surface);
            color: var(--text-primary);
            border: 1px solid var(--color-border);
        }

        .btn-close-invoice:hover {
            background: var(--color-bg-subtle);
        }

        @media print {
            body * {
                visibility: hidden;
            }

            .invoice-wrapper,
            .invoice-wrapper * {
                visibility: visible;
            }

            .invoice-wrapper {
                position: absolute;
                top: 0;
                left: 0;
                background: white;
                padding: 0;
            }

            .invoice {
                box-shadow: none;
                border-radius: 0;
                border: none;
            }

            .invoice-actions {
                display: none;
            }
        }
    </style>
    <link rel="icon" type="image/png" href="assets/images/fevicon.png">
</head>

<body>
    <!-- Header -->
    <header class="header">
        <div class="container nav">
            <a href="index.html" class="logo">EnrouteIn<span>.</span><span class="logo-badge">Store</span></a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Store</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Support</a></li>
            </ul>
            <div class="nav-actions">
                <a href="dashboard.html" class="btn btn-primary"
                    style="padding: 0.6rem; border-radius: 50%; aspect-ratio: 1/1;" title="Dashboard">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                        <circle cx="12" cy="7" r="4" />
                    </svg>
                </a>
            </div>
        </div>
    </header>

    <div class="container success-container" id="main-content">
        <div class="success-icon-badge">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"
                stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12" />
            </svg>
        </div>
        <h1 class="success-title">Download Your Purchase</h1>
        <p class="text-secondary mt-2">Thank you for your purchase. Your digital license is ready.</p>
        <div id="order-details-container">
            <!-- Content will be injected by JS -->
        </div>
    </div>

    <!-- Invoice Modal -->
    <div class="invoice-wrapper" id="invoice-wrapper">
        <div class="invoice" id="invoice-content">
            <!-- Invoice will be rendered here by JS -->
        </div>
    </div>

    <!-- Logic -->
    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/download.js"></script>
    <script src="js/cookie-consent.js"></script>
</body>

</html>
